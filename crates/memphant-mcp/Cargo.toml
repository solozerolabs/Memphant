[package]
name = "memphant-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

# fastembed is needed for the MCP `remember` WRITE path: it embeds unit bodies on
# ingest (full embedder, dimensions() > 0) so the dense Vector channel has vectors
# to search. Without it, `cargo build -p memphant-mcp` stores no embeddings and the
# server's `/v1/recall` vector channel is dead for anything this binary wrote.
# NOTE: the MCP's own `recall` tool is provider-free BY DESIGN (NoopEmbedding, the
# compact-only portable lane) and is lexical regardless of this feature — vector
# recall is served on the HTTP `/v1/recall` path, not the native MCP recall tool.
# Mirror memphant-server: ship fastembed by default rather than depend on workspace
# feature-unification to pull it in.
[features]
default = ["fastembed"]
fastembed = ["memphant-runtime/fastembed"]
qwen3 = ["memphant-runtime/qwen3"]

[dependencies]
axum.workspace = true
memphant-core.workspace = true
memphant-runtime = { path = "../memphant-runtime" }
memphant-types.workspace = true
rmcp = { version = "2.2", features = [
  "server",
  "macros",
  "schemars",
  "transport-io",
  "transport-streamable-http-server",
  "transport-streamable-http-server-session",
] }
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
uuid.workspace = true

[dev-dependencies]
memphant-store-testkit.workspace = true
rmcp = { version = "2.2", features = ["client"] }
tempfile.workspace = true
