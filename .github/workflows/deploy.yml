name: Deploy

# Redeploys the memphant-prod Fly cell whenever code that reaches the runtime
# image lands on main. Docs/eval/bench changes do not trigger a deploy.
on:
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - 'memphant_migrations/**'
      - 'config/**'
      - 'scripts/apply_memphant_migrations.py'
      - 'scripts/provision_login_roles.sh'
      - 'Dockerfile'
      - 'fly.toml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/deploy.yml'
  workflow_dispatch: {}

concurrency:
  group: deploy-memphant-prod
  cancel-in-progress: false  # never cancel a mid-flight deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Pins copied from Syndai's deploy.yml (known-good on this Fly account).
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
      - name: Deploy memphant-prod
        run: flyctl deploy --remote-only --app memphant-prod
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Post-deploy health
        run: |
          # Private-only app: no public URL. Verify machines are started and
          # the server check is passing via the machines API.
          flyctl status --app memphant-prod
          flyctl checks list --app memphant-prod | tee /tmp/checks.txt
          grep -q "passing" /tmp/checks.txt || { echo "health check not passing"; exit 1; }
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
