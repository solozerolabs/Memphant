# MemPhant production cell — private-only (6PN), reached by its consumer app at
# http://memphant-prod.internal:3000. No public service on purpose:
# a serviceless app must keep restart=always and never scale to zero
# (a Fly serviceless app with autostart/autostop would be reaped — keep restart=always).
app = 'memphant-prod'
primary_region = 'sjc'
kill_signal = 'SIGTERM'

[build]
  dockerfile = 'Dockerfile'

[env]
  MEMPHANT_BIND = '[::]:3000'  # 6PN is IPv6; 0.0.0.0 refuses cross-app connections
  MEMPHANT_MCP_BIND = '[::]:3333'  # read only by the mcp process; same IPv6 rule as MEMPHANT_BIND
  # rmcp's Host validation defaults to loopback-only (DNS-rebinding defense);
  # every non-loopback authority clients dial must be listed or the transport
  # 4xxes before auth. Loopback (fly proxy) is always accepted implicitly.
  MEMPHANT_MCP_ALLOWED_HOSTS = 'memphant-prod.internal:3333,mcp.process.memphant-prod.internal:3333'
  RUST_LOG = 'info'
  # Phase A serves deterministic profile facts (retain + projection reads);
  # the dense channel is unused. This also removes the HuggingFace model
  # download from the startup path — a third-party cold-start dependency that
  # crashed the first boot. Bake the model into the image before any feature
  # that needs vectors on this cell.
  MEMPHANT_EMBEDDINGS = 'small'  # bge-small-en-v1.5 (384-dim, baked into the image); dense recall channel ON

[processes]
  server = 'memphant-server'
  worker = 'memphant-worker'
  mcp = 'memphant-mcp streamable-http'

# No [http_service]: private networking only, BY DESIGN. The mcp streamable-http
# transport is multi-tenant and authenticates the presented Bearer PER REQUEST
# (crates/memphant-mcp: resolve_http_principal), so it no longer needs a
# process-wide MEMPHANT_API_KEY — it needs only the two served database URLs
# (MEMPHANT_APP_DATABASE_URL + MEMPHANT_AUTHN_DATABASE_URL, already app secrets;
# never DATABASE_URL — the server refuses the migrator cred) and refuses to start
# on a non-authn-capable store. Lane-2 recall reaches this endpoint over 6PN
# through the Syndai backend's recall proxy (behind its existing public edge),
# NOT a public Fly service — that keeps this cell's serviceless never-reaped
# invariant and adds no public attack surface. The HTTP transport is also
# RECALL-ONLY (the four mutating tools are server-disabled; writes/forgets are
# backend-owned over private REST). A dedicated public endpoint with its own TLS
# edge + rate-limit is deferred to the standalone-product phase (dedicated DB).
# Laptop access: `fly proxy 3333 -a memphant-prod`. See
# docs/deployment/prod-cell-runbook.md.

[[restart]]
  policy = 'always'

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
  processes = ['server']
  count = 1

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
  processes = ['worker']
  count = 1

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
  processes = ['mcp']
  count = 1

[checks.server_health]
  type = 'http'
  port = 3000
  method = 'get'
  path = '/v1/health'
  interval = '30s'
  timeout = '5s'
  grace_period = '30s'
  processes = ['server']
