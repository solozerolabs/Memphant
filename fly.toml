# MemPhant production cell — private-only (6PN), reached by syndai-prod at
# http://memphant-prod.internal:3000. No public service on purpose:
# a serviceless app must keep restart=always and never scale to zero
# (see Syndai LEARNINGS fly-serviceless-worker-autostop-reaps-it).
app = 'memphant-prod'
primary_region = 'sjc'
kill_signal = 'SIGTERM'

[build]
  dockerfile = 'Dockerfile'

[env]
  MEMPHANT_BIND = '[::]:3000'  # 6PN is IPv6; 0.0.0.0 refuses cross-app connections
  MEMPHANT_MCP_BIND = '[::]:3333'  # read only by the mcp process; same IPv6 rule as MEMPHANT_BIND
  # rmcp's Host validation defaults to loopback-only (DNS-rebinding defense);
  # every non-loopback authority clients dial must be listed or the transport
  # 4xxes before auth. Loopback (fly proxy) is always accepted implicitly.
  MEMPHANT_MCP_ALLOWED_HOSTS = 'memphant-prod.internal:3333,mcp.process.memphant-prod.internal:3333'
  RUST_LOG = 'info'
  # Phase A serves deterministic profile facts (retain + projection reads);
  # the dense channel is unused. This also removes the HuggingFace model
  # download from the startup path — a third-party cold-start dependency that
  # crashed the first boot. Bake the model into the image before any feature
  # that needs vectors on this cell.
  MEMPHANT_EMBEDDINGS = 'off'

[processes]
  server = 'memphant-server'
  worker = 'memphant-worker'
  mcp = 'memphant-mcp streamable-http'

# No [http_service]: private networking only. Secrets carry the three served
# database URLs (never DATABASE_URL — the server refuses the migrator cred).
# The mcp process reuses MEMPHANT_APP_DATABASE_URL + MEMPHANT_AUTHN_DATABASE_URL
# (already app secrets, shared with server/worker) and additionally REQUIRES the
# MEMPHANT_API_KEY secret — a context-BOUND tenant key (mk_…); the process
# refuses to start without it (resolve_tenant). Laptop access:
# `fly proxy 3333 -a memphant-prod`. See docs/deployment/prod-cell-runbook.md.

[[restart]]
  policy = 'always'

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
  processes = ['server']
  count = 1

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
  processes = ['worker']
  count = 1

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
  processes = ['mcp']
  count = 1

[checks.server_health]
  type = 'http'
  port = 3000
  method = 'get'
  path = '/v1/health'
  interval = '30s'
  timeout = '5s'
  grace_period = '30s'
  processes = ['server']
